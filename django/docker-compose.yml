name: homelab-stack

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  home-net:
    external: true

services:
  parser:
    image: jokerwho/palworld-server-tool:0.12.2@sha256:960d08c746ae673cc8c8e2949ae6aa3c3524c428b2e60229f34870a9cfa03ef9
    container_name: homelab-palworld-parser
    user: "1000:1000"
    entrypoint: ["sh", "-c"]
    command: ["while :; do sleep 3600; done"]
    volumes:
      - ./data/pals:/work
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "test", "-x", "/app/sav_cli"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging: *default-logging
    restart: unless-stopped

  dashboard:
    depends_on:
      parser:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile
    image: homelab-dashboard:local
    container_name: homelab-dashboard
    env_file:
      - .env
    environment:
      DJANGO_DEBUG: "false"
      DJANGO_DB_PATH: /data/db.sqlite3
      GAME_STACK_COMPOSE_FILE: /game-stack/docker-compose.yml
      GAME_STACK_ENV_FILE: /shared.env
      PALWORLD_LOCAL_ROOT: /data/pals
      PALWORLD_DECODE_WORK_DIR: /data/pals/decode-work
      PALWORLD_LIVE_SAVE_DIR: /palworld-save
      PALWORLD_PARSER_RUNTIME: docker
      PALWORLD_PARSER_CONTAINER: homelab-palworld-parser
      PALWORLD_PARSER_CONTAINER_WORK_DIR: /work/decode-work
      PALWORLD_PARSER_ASSETS_DIR: /opt/palworld-assets
    ports:
      - "${HOMELAB_PORT:-7716}:8000"
    volumes:
      - ./data:/data
      - ${PALWORLD_LIVE_SAVE_HOST_DIR:?Set PALWORLD_LIVE_SAVE_HOST_DIR in django/.env}:/palworld-save:ro
      - ../game-stack/docker-compose.yml:/game-stack/docker-compose.yml:ro
      - ../.env:/shared.env:ro
      - /var/run/docker.sock:/var/run/docker.sock
    group_add:
      - "${DOCKER_GID:?Set DOCKER_GID to the Docker socket group ID}"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - home-net
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "--header=Host: localhost", "http://127.0.0.1:8000/admin/login/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging: *default-logging
    restart: unless-stopped
