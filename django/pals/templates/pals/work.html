{% extends "pals/tool_base.html" %}
{% block tool_form %}
<label>
    Owner
    <select class="js-owner" name="owner"></select>
</label>
<label>
    Work Skill
    <select class="js-work-type" name="work" required></select>
</label>
<label>
    Display
    <select name="display">
        <option value="all">All candidates</option>
        <option value="owned">Owned only</option>
    </select>
</label>
<label class="check-row">
    <input name="includeInsomnia" type="checkbox">
    Add Insomnia to the passive target
</label>
{% endblock %}
