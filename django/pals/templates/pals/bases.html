{% extends "pals/tool_base.html" %}
{% block tool_form %}
<label>
    Owner
    <select class="js-owner" name="owner"></select>
</label>
<label>
    Base
    <select class="js-base" name="baseId"></select>
</label>
<label>
    Base Name
    <span class="base-name-row">
        <input id="baseLabel" name="baseLabel" autocomplete="off" placeholder="Name this base">
        <button type="button" id="saveBaseLabel">Save</button>
    </span>
    <span class="field-hint" id="baseLabelHint">Save a local display name for the selected base.</span>
</label>
<label>
    Planner Mode
    <select name="plannerMode">
        <option value="ideal">Ideal targets</option>
        <option value="right_now">Right now - owned only</option>
    </select>
</label>
<label>
    Workers
    <input name="maxWorkers" type="number" min="1" max="15" value="15">
</label>
{% endblock %}
