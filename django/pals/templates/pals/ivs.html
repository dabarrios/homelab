{% extends "pals/tool_base.html" %}
{% block tool_form %}
<label>
    Owner
    <select class="js-owner" name="owner"></select>
</label>
<label>
    Target Species
    <input name="target" list="speciesList" autocomplete="off" required>
</label>
<label>
    Final Passives
    <textarea name="passives" rows="4" placeholder="Every selected passive is bred naturally unless listed below."></textarea>
</label>
<label>
    Implant Passives
    <textarea name="implantPassives" rows="3" placeholder="Optional. Must also be in Final Passives."></textarea>
</label>
<label>
    Gender
    <select name="genderPreference">
        <option value="any">No preference</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>
</label>
{% endblock %}
