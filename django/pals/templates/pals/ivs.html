{% extends "pals/tool_base.html" %}
{% block tool_form %}
<label>
    Owner
    <select class="js-owner" name="owner"></select>
</label>
<label>
    Target Species
    <span class="suggest-field" data-suggest="species">
        <input name="target" data-suggest-input autocomplete="off" required>
        <span class="suggest-menu" data-suggest-menu></span>
    </span>
</label>
<label>
    Final Passives
    <span class="passive-picker" data-picker="passives">
        <span class="passive-input-row">
            <input data-passive-input autocomplete="off" placeholder="Choose a passive">
            <button type="button" data-passive-add>Add</button>
        </span>
        <span class="passive-chips" data-passive-chips></span>
        <input type="hidden" name="passives">
        <span class="field-hint" data-passive-hint>Every selected passive is bred naturally unless added below.</span>
    </span>
</label>
<label>
    Implant Passives
    <span class="passive-picker" data-picker="implantPassives">
        <span class="passive-input-row">
            <input data-passive-input autocomplete="off" placeholder="Choose an implant passive">
            <button type="button" data-passive-add>Add</button>
        </span>
        <span class="passive-chips" data-passive-chips></span>
        <input type="hidden" name="implantPassives">
        <span class="field-hint" data-passive-hint>Optional. Must also be in Final Passives.</span>
    </span>
</label>
<label>
    Gender
    <select name="genderPreference">
        <option value="any">No preference</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>
</label>
{% endblock %}
