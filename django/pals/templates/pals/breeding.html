{% extends "pals/tool_base.html" %}
{% block tool_form %}
<label>
    Owner
    <select class="js-owner" name="owner"></select>
</label>
<label>
    Target Species
    <span class="suggest-field" data-suggest="species">
        <input name="target" data-suggest-input autocomplete="off" required>
        <span class="suggest-menu" data-suggest-menu></span>
    </span>
</label>
<label>
    Desired Passives
    <span class="passive-picker" data-picker="passives">
        <span class="passive-input-row">
            <input data-passive-input autocomplete="off" placeholder="Choose a passive">
            <button type="button" data-passive-add>Add</button>
            <button type="button" data-passive-clear>Clear</button>
        </span>
        <span class="passive-chips" data-passive-chips></span>
        <input type="hidden" name="passives">
        <span class="field-hint" data-passive-hint>Pick from known passives in your loaded roster.</span>
    </span>
</label>
<label class="check-row">
    <input name="includeImplants" type="checkbox" value="1" checked>
    Use implant inventory for passives you can add later
</label>
<label class="check-row">
    <input name="includeInsomnia" type="checkbox" value="1">
    Include Insomnia
</label>
<div class="inventory-summary">
    <button type="button" data-open-implant-inventory>Manage Implant Inventory</button>
    <button type="button" data-open-passive-colors>Manage Passive Colors</button>
</div>
<label>
    Gender
    <select name="genderPreference">
        <option value="any">No preference</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>
</label>
<label>
    Passive Profile
    <span class="profile-control">
        <select name="breedingProfile" id="breedingProfile"></select>
        <span class="profile-buttons">
            <button type="button" id="addProfile">Add</button>
            <button type="button" id="editProfile">Edit</button>
        </span>
    </span>
    <span class="field-hint" id="profileHint">Manual passives lets you choose each passive yourself.</span>
</label>
<label>
    Saved Setup
    <span class="saved-plan-control">
        <span class="saved-plan-row">
            <input id="breedingPlanName" autocomplete="off" placeholder="Plan name">
            <button type="button" id="saveBreedingPlan">Save</button>
            <button type="button" id="renameBreedingPlan">Edit</button>
        </span>
        <span class="saved-plan-row saved-plan-load-row">
            <select id="savedBreedingPlan"></select>
            <button type="button" id="loadBreedingPlan">Load</button>
            <button type="button" id="deleteBreedingPlan">Delete</button>
        </span>
    </span>
    <span class="field-hint" id="breedingPlanStatus">Save the current setup and exact displayed tree.</span>
</label>
{% endblock %}
