{% extends "pals/tool_base.html" %}
{% block tool_form %}
<label>
    Owner
    <select class="js-owner" name="owner"></select>
</label>
<label>
    Target Species
    <input name="target" list="speciesList" autocomplete="off" required>
</label>
<label>
    Desired Passives
    <textarea name="passives" rows="4" placeholder="One per line, or comma-separated"></textarea>
</label>
<label>
    Gender
    <select name="genderPreference">
        <option value="any">No preference</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
    </select>
</label>
<label>
    Route Profile
    <select name="breedingProfile">
        <option value="manual">Manual passives</option>
        <option value="work_speed">Best work speed</option>
        <option value="ranch_drops_focus">Ranch drops focus</option>
    </select>
</label>
{% endblock %}
